<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psychotherapeutische Praxis – Kamenz</title>
  <meta name="description" content="Psychotherapeutische Praxis in Kamenz. Begleitung für Privatpatient:innen, Beihilfeberechtigte und Selbstzahlende.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --color-bg: #f8f6f2; --color-surface: #faf9f6; --color-surface-2: #fdfcfa;
      --color-surface-offset: #f2ede8; --color-divider: #e2ddd8; --color-border: #d8d3cc;
      --color-text: #2c2820; --color-text-muted: #706b63; --color-text-faint: #b0a89e;
      --color-text-inverse: #faf9f6;
      --color-primary: #5a7a6e; --color-primary-hover: #3d5e52;
      --color-primary-active: #2a453b; --color-primary-highlight: #dce8e4;
      --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
      --radius-xl: 1rem; --radius-full: 9999px;
      --space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;
      --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
      --space-12:3rem;--space-16:4rem;--space-20:5rem;--space-24:6rem;
      --text-xs: clamp(0.75rem,0.7rem + 0.25vw,0.875rem);
      --text-sm: clamp(0.875rem,0.8rem + 0.35vw,1rem);
      --text-base: clamp(1rem,0.95rem + 0.25vw,1.125rem);
      --text-lg: clamp(1.125rem,1rem + 0.75vw,1.5rem);
      --text-xl: clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --text-2xl: clamp(2rem,1.2rem + 2.5vw,3.5rem);
      --font-display: 'Lora', Georgia, serif;
      --font-body: 'Inter', 'Helvetica Neue', sans-serif;
      --shadow-sm: 0 1px 2px rgba(44,40,32,0.06);
      --shadow-md: 0 4px 12px rgba(44,40,32,0.08);
      --transition: 180ms cubic-bezier(0.16,1,0.3,1);
      --content-default: 900px; --content-wide: 1160px;
    }
    [data-theme="dark"] {
      --color-bg:#1a1816;--color-surface:#1f1d1b;--color-surface-2:#242220;
      --color-surface-offset:#1d1b19;--color-divider:#2e2c2a;--color-border:#3a3835;
      --color-text:#cdc9c3;--color-text-muted:#7a7570;--color-text-faint:#5a5652;
      --color-text-inverse:#1f1d1b;
      --color-primary:#7fa898;--color-primary-hover:#5d8a7a;
      --color-primary-active:#3d6e5e;--color-primary-highlight:#2a3d38;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.2);--shadow-md:0 4px 12px rgba(0,0,0,0.3);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;scroll-padding-top:5rem;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg);line-height:1.7}
    img,picture,video{display:block;max-width:100%;height:auto}
    h1,h2,h3,h4{font-family:var(--font-display);line-height:1.2;text-wrap:balance}
    p,li{text-wrap:pretty;max-width:68ch}
    a{color:var(--color-primary);text-decoration:none;transition:color var(--transition)}
    a:hover{color:var(--color-primary-hover)}
    button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
    ::selection{background:var(--color-primary-highlight);color:var(--color-text)}
    :focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}
    .nav{position:sticky;top:0;z-index:100;background:rgba(248,246,242,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--color-divider);padding:var(--space-4) var(--space-6)}
    [data-theme="dark"] .nav{background:rgba(26,24,22,0.92)}
    .nav-inner{max-width:var(--content-wide);margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:var(--space-8)}
    .nav-logo{display:flex;align-items:center;gap:var(--space-3);font-family:var(--font-display);font-size:var(--text-base);color:var(--color-text);font-weight:500;letter-spacing:0.01em}
    .nav-links{display:flex;align-items:center;gap:var(--space-6);list-style:none}
    .nav-links a{font-size:var(--text-sm);color:var(--color-text-muted);transition:color var(--transition);font-weight:400}
    .nav-links a:hover{color:var(--color-text)}
    .nav-cta{display:inline-flex;align-items:center;background:var(--color-primary);color:var(--color-text-inverse) !important;padding:var(--space-2) var(--space-5);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:500;transition:background var(--transition)}
    .nav-cta:hover{background:var(--color-primary-hover) !important;color:var(--color-text-inverse) !important}
    .theme-toggle{width:36px;height:36px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);border:1px solid var(--color-border);transition:color var(--transition),border-color var(--transition)}
    .theme-toggle:hover{color:var(--color-text);border-color:var(--color-text-muted)}
    .nav-mobile-toggle{display:none}
    .container{max-width:var(--content-default);margin-inline:auto;padding-inline:var(--space-6)}
    .container--wide{max-width:var(--content-wide);margin-inline:auto;padding-inline:var(--space-6)}
    .section{padding-block:clamp(var(--space-12),7vw,var(--space-24))}
    .section--alt{background:var(--color-surface)}
    @media(max-width:768px){
      .nav-links{display:none}
      .nav-links.open{display:flex;flex-direction:column;align-items:flex-start;position:absolute;top:100%;left:0;right:0;background:var(--color-surface);border-bottom:1px solid var(--color-divider);padding:var(--space-4) var(--space-6);gap:var(--space-4)}
      .nav-mobile-toggle{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius-md);color:var(--color-text-muted)}
      .nav{position:relative}
    }
  </style>
</head>
<body>
  <nav class="nav" role="navigation" aria-label="Hauptnavigation">
    <div class="nav-inner">
      <a href="#start" class="nav-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <circle cx="14" cy="14" r="12" stroke="currentColor" stroke-width="1.5"/>
          <path d="M9 14c0-2.76 2.24-5 5-5s5 2.24 5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="14" cy="17" r="1.5" fill="currentColor"/>
        </svg>
        <span>Psychotherapeutische Praxis</span>
      </a>
      <ul class="nav-links" id="nav-links">
        <li><a href="#angebot">Angebot</a></li>
        <li><a href="#ueber-mich">Über mich</a></li>
        <li><a href="#ablauf">Ablauf & Kosten</a></li>
        <li><a href="#kontakt" class="nav-cta">Kontakt</a></li>
        <li><button class="theme-toggle" data-theme-toggle aria-label="Dunkelmodus aktivieren"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button></li>
      </ul>
      <button class="nav-mobile-toggle" id="mobile-toggle" aria-label="Menü öffnen" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </nav>
  <main id="main">
    <p style="padding:4rem 2rem;text-align:center;color:var(--color-text-muted);font-family:var(--font-body)">Inhalte folgen in den nächsten Commits…</p>
  </main>
  <script>
    (function(){
      const t=document.querySelector('[data-theme-toggle]'),r=document.documentElement;
      let d=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
      r.setAttribute('data-theme',d);
      if(t)t.addEventListener('click',()=>{
        d=d==='dark'?'light':'dark';
        r.setAttribute('data-theme',d);
        t.setAttribute('aria-label','Zu '+(d==='dark'?'Hellmodus':'Dunkelmodus')+' wechseln');
        t.innerHTML=d==='dark'
          ?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
          :'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      });
      const btn=document.getElementById('mobile-toggle'),nav=document.getElementById('nav-links');
      if(btn&&nav)btn.addEventListener('click',()=>{
        const open=nav.classList.toggle('open');
        btn.setAttribute('aria-expanded',open);
      });
    })();
  </script>
</body>
</html>
